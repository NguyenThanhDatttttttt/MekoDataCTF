---
- name: Configure common hosts
  hosts: hosts
  become: true
  roles:
    - hosts

- name: Configure Team A attacker
  hosts: attacker-a
  become: true
  roles:
    - role: user-access
      user_access_username: user
      user_access_password: CHANGE_ME_A
      user_access_sudo: true

- name: Configure Team B attacker
  hosts: attacker-b
  become: true
  roles:
    - role: user-access
      user_access_username: user
      user_access_password: CHANGE_ME_B
      user_access_sudo: true

- name: Configure router
  hosts: router
  become: true
  tasks:
    - name: Enable IPv4 forwarding
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-mekodatactf.conf
        reload: true
