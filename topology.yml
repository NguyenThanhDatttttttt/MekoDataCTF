name: mekodatactf-ad

hosts:
  - name: ubuntu-server
    flavor: standard.small
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: ubuntu-net
    cidr: 10.10.1.0/24
    accessible_by_user: false

net_mappings:
  - host: ubuntu-server
    network: ubuntu-net
    ip: 10.10.1.10

routers: []

router_mappings: []

groups: []
